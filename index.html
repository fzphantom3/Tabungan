<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArthaX - Tabungan Impian</title>
    <style>
        /* Mengatur font dan warna dasar (Dark Mode) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a; /* Warna biru gelap sesuai gambar */
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Bagian Header */
        .header {
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .header p {
            color: #94a3b8;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 28px;
            line-height: 1.3;
            color: #cbd5e1;
        }

        .header h1 span {
            color: #60a5fa; /* Warna biru terang untuk teks "mulai ditabung" */
        }

        /* Card Total Tabungan */
        .card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            margin-bottom: 30px;
        }

        .card p.label {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card h2 {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Form Input */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="number"] {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #60a5fa;
        }

        button {
            background-color: #3b82f6; /* Warna tombol biru */
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:active {
            background-color: #2563eb;
        }

        /* Tombol Reset */
        .btn-reset {
            background-color: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <p>MULAI DARI HAL KECIL</p>
        <h1>Impianmu,<br><span>mulai ditabung.</span></h1>
    </div>

    <div class="card">
        <p class="label">Total tabungan</p>
        <!-- ID "totalSaldo" ini yang akan diubah oleh JavaScript -->
        <h2 id="totalSaldo">Rp 0</h2>
        
        <div class="form-group">
            <input type="number" id="inputNominal" placeholder="Masukkan nominal (Cth: 50000)">
            <button onclick="tambahTabungan()">+ Tambah Tabungan</button>
        </div>
    </div>

    <button class="btn-reset" onclick="resetTabungan()">Reset Tabungan (Mulai dari 0)</button>

    <script>
        // 1. Ambil data dari memori HP (localStorage), kalau kosong set ke 0
        let saldoSaatIni = parseInt(localStorage.getItem('saldoArthaX')) || 0;

        // 2. Fungsi untuk memformat angka menjadi Rupiah (Cth: 1201200 -> Rp 1.201.200)
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(angka);
        }

        // 3. Tampilkan saldo saat aplikasi pertama dibuka
        function updateTampilan() {
            document.getElementById('totalSaldo').innerText = formatRupiah(saldoSaatIni);
        }

        // 4. Fungsi saat tombol "Tambah" diklik
        function tambahTabungan() {
            let inputElement = document.getElementById('inputNominal');
            let nominalBaru = parseInt(inputElement.value);

            // Cek apakah input kosong atau bukan angka
            if (isNaN(nominalBaru) || nominalBaru <= 0) {
                alert("Masukkan angka nominal yang benar ya!");
                return;
            }

            // Tambahkan ke saldo
            saldoSaatIni += nominalBaru;

            // Simpan ke memori HP
            localStorage.setItem('saldoArthaX', saldoSaatIni);

            // Perbarui tampilan dan kosongkan input
            updateTampilan();
            inputElement.value = '';
            alert("Berhasil menabung " + formatRupiah(nominalBaru) + "!");
        }

        // 5. Fungsi untuk mereset tabungan ke 0
        function resetTabungan() {
            if (confirm("Yakin mau reset tabungan jadi 0? Data tidak bisa kembali loh.")) {
                saldoSaatIni = 0;
                localStorage.setItem('saldoArthaX', 0);
                updateTampilan();
            }
        }

        // Jalankan fungsi tampilan saat pertama kali dibuka
        updateTampilan();
    </script>

</body>
</html>
